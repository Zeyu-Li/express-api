name: Express Test

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: yarn
      - name: yarn install and test
        run: |
          yarn install --frozen-lockfile
          yarn test
